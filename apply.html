<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02050c">
<title>You're in | DME Fiber</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#02050c;color:#eef6ff;font:18px/1.55 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
canvas{position:fixed;inset:0;pointer-events:none}
.box{position:relative;z-index:1;max-width:480px}
.lvl{display:inline-block;border:2px solid #25e4ff;color:#25e4ff;border-radius:999px;padding:6px 18px;font-weight:700;letter-spacing:2px;margin-bottom:18px;animation:pop .6s ease both}
h1{font-size:clamp(44px,13vw,80px);line-height:.95;font-style:italic;font-weight:900;text-transform:uppercase;background:linear-gradient(90deg,#1b8cff,#25e4ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .7s .15s ease both}
p{color:#9ab2cf;margin:18px 0 28px;animation:pop .7s .3s ease both}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 30px;border-radius:999px;font-weight:700;color:#021018;background:linear-gradient(90deg,#1b8cff,#25e4ff);text-decoration:none;animation:pop .7s .45s ease both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="box">
  <div class="lvl">LEVEL UP</div>
  <h1>You're in.</h1>
  <p>Application received. We'll reach out soon. Get ready.</p>
  <a class="btn" href="/">Back to site</a>
</div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,P=[];
function size(){W=c.width=innerWidth;H=c.height=innerHeight}
size();addEventListener('resize',size);
var cols=['#1b8cff','#25e4ff','#eef6ff','#3dffb0'];
for(var i=0;i<140;i++){P.push({x:Math.random()*W,y:-Math.random()*H,r:4+Math.random()*6,s:2+Math.random()*4,d:Math.random()*2*Math.PI,k:cols[i%4],t:Math.random()*0.1})}
function draw(){
  x.clearRect(0,0,W,H);
  P.forEach(function(p){
    p.y+=p.s;p.d+=p.t;p.x+=Math.sin(p.d)*1.5;
    if(p.y>H){p.y=-10;p.x=Math.random()*W}
    x.fillStyle=p.k;x.fillRect(p.x,p.y,p.r,p.r*1.6);
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
